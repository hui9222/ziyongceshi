#!name=汽水音乐净化[Shadowrocket版]
#!desc=汽水音乐去广告规则，适用于小火箭
#!author=ddgksf2013修改版
#!update-date=2026-08-11

[General]
bypass-system = true

[Rule]

# 汽水音乐域名
DOMAIN,beta-luna.douyin.com,REJECT
DOMAIN,api.qishui.com,REJECT

# 字节跳动广告域名
DOMAIN-SUFFIX,zijieapi.com,REJECT

[URL Rewrite]

# 视频广告
^https?:\/\/[^\/]+\/luna\/media_ads reject

# 通用广告
^https?:\/\/[^\/]+\/luna\/ads reject

# 广告弹窗
^https?:\/\/[^\/]+\/luna\/commerce reject

# 活动推广
^https?:\/\/[^\/]+\/luna\/activities reject

# 标签推荐
^https?:\/\/[^\/]+\/luna\/hashtag\/recommend reject

# 定位信息上传
^https?:\/\/[^\/]+\/luna\/location\/info reject

# DNS域名获取
^https?:\/\/tnc\..*zijieapi\.com\/get_domains reject

# 搜索推荐
^https?:\/\/[^\/]+\/luna\/search-block reject

[MITM]

hostname = %APPEND% beta-luna.douyin.com, api.qishui.com, *.zijieapi.com
